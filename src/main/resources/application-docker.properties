# Activated via SPRING_PROFILES_ACTIVE=docker (set in docker-compose.yml's app
# service). Overrides the H2 defaults in application.properties so local dev
# via `docker-compose up` runs against real Postgres - the default `mvn test`/
# `mvn spring-boot:run` path outside Docker is untouched and still uses H2.
spring.datasource.url=jdbc:postgresql://db:5432/relay
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=relay
spring.datasource.password=relay

spring.h2.console.enabled=false

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=relay
spring.rabbitmq.password=relay
