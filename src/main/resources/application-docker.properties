# Activated via SPRING_PROFILES_ACTIVE=docker (set in docker-compose.dev.yml's app service). The
# default profile has no datasource of its own (see application.properties), so this is the only
# place the app's real connection details live.
spring.datasource.url=jdbc:postgresql://db:5432/relay
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=relay
spring.datasource.password=relay

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=relay
spring.rabbitmq.password=relay

spring.data.redis.host=redis
spring.data.redis.port=6379
