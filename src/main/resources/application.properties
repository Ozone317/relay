spring.application.name=relay

# H2 in-memory database (dev only)
spring.datasource.url=jdbc:h2:mem:relay
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at http://localhost:8080/h2-console (JDBC URL above)
spring.h2.console.enabled=true

# Flyway owns the schema (src/main/resources/db/migration/{vendor}/) - Hibernate only
# validates that the entities match what Flyway created, equivalent in spirit to
# `manage.py migrate` plus Django's migration-vs-model drift check.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# {vendor} resolves to h2 or postgresql depending on the active datasource, since H2 (default/
# test profile, rebuilt from scratch every run) and Postgres (docker profile) need slightly
# different column types (native ENUM/JSON on H2 vs varchar+check/jsonb on Postgres).
spring.flyway.locations=classpath:db/migration/{vendor}

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false

relay.reconciliation.interval=30s
relay.reconciliation.created-grace=60s
relay.reconciliation.in-flight-grace=90s
relay.reconciliation.batch-size=100
relay.reconciliation.scheduled-slack=5m
relay.reconciliation.dead-letter-grace=5m

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
