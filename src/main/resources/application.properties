spring.application.name=relay

# Flyway owns the schema (src/main/resources/db/migration/) - Hibernate only validates that the
# entities match what Flyway created, equivalent in spirit to `manage.py migrate` plus Django's
# migration-vs-model drift check.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Postgres-only project - Flyway's default location, classpath:db/migration, applies, so there's
# no spring.flyway.locations property here. The app is only ever run via the `docker` profile
# (see application-docker.properties for real connection details); the default profile has no
# datasource of its own, since tests get theirs dynamically from a shared Testcontainers Postgres
# container (see com.example.relay.support.SharedPostgresContainer).

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false

relay.reconciliation.interval=30s
relay.reconciliation.created-grace=60s
relay.reconciliation.in-flight-grace=90s
relay.reconciliation.batch-size=100
relay.reconciliation.scheduled-slack=5m
relay.reconciliation.dead-letter-grace=5m

relay.delivery.consumer-concurrency=4
relay.delivery.prefetch-count=10

jwt.secret=${JWT_SECRET}
relay.auth.access-token-ttl=15m
relay.auth.refresh-idle-window=30d
relay.auth.cookie-secure=true
relay.auth.allowed-origin=http://localhost:3000
