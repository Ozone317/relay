<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Relay</title>
</head>
<body style="font-family: sans-serif; color: #222222;">
    <div th:fragment="layout(content)" style="max-width: 600px; margin: 0 auto; padding: 24px;">
        <h2 style="color: #444444;">Relay</h2>
        <div th:replace="${content}"></div>
        <hr style="margin-top: 32px; border: none; border-top: 1px solid #dddddd;"/>
        <p style="font-size: 12px; color: #888888;">This is an automated message from Relay.</p>
    </div>
</body>
</html>
