<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{email/layout :: layout(~{::#content})}">
    <div id="content">
        <p>We received a request to reset your Relay password.</p>
        <p><a th:href="${resetUrl}" th:text="${resetUrl}">https://app.relay.example/reset-password?token=...</a></p>
        <p>This link expires in 30 minutes. If you did not request this, you can safely ignore this email.</p>
    </div>
</div>
</body>
</html>
